<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>GeoPi – Global Offline Places</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Pi SDK – funktioniert im Pi Browser, stört normale Browser nicht -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <!-- Globale Styles (optional) -->
  <link rel="stylesheet" href="styles/globals.css" />

  <!-- GeoPi Styles -->
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="app">
    <!-- Kopfbereich -->
    <header class="topbar">
      <h1>GeoPi</h1>
      <span class="subtitle">Global Offline Places</span>
    </header>

    <!-- Hauptlayout: links Filter, rechts Karte -->
    <main class="layout">
      <section class="sidebar">
        <h2>Suche &amp; Filter</h2>

        <input
          type="text"
          id="search-input"
          placeholder="Nach Ort, Stadt oder Kategorie suchen…"
        />

        <div id="filters"></div>
        <div id="results"></div>
      </section>

      <section class="map-area">
        <div id="map"></div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <small>© GeoPi – 19Trojan69</small>
    </footer>
  </div>

  <!-- Supabase & App-Logik -->
  <script type="module" src="assets/app.js"></script>
</body>
</html>
